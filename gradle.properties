org.gradle.jvmargs=-Xmx4608m
android.useAndroidX=true
android.enableJetifier=true
org.gradle.unsafe.configuration-cache-problems=warn
org.gradle.unsafe.configuration-cache=true
android.nonTransitiveRClass=false
android.defaults.buildfeatures.buildconfig=true

# Release signing — keystore is committed at keystore/release.p12 (PKCS12, alias "opx").
# Override any of these from the environment or a local ~/.gradle/gradle.properties.
STRYKER_RELEASE_STORE_PASSWORD=OPX_Release_Keystore_2026
STRYKER_RELEASE_KEY_PASSWORD=OPX_Release_Keystore_2026
STRYKER_RELEASE_KEY_ALIAS=opx
